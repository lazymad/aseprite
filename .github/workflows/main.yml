
name: Build Aseprite (macOS & Ubuntu)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: aseprite-ubuntu
            output_archive: aseprite-ubuntu.zip
            skia_tag: m102-861e474657
            skia_asset: Skia-Linux-Release-x64-libstdc++.zip
          - os: macos-latest
            artifact_name: aseprite-macos
            output_archive: aseprite-macos.zip
            skia_tag: m102-861e474657
            skia_asset: Skia-macOS-Release-x64.zip

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    # 1. 安裝系統編譯依賴
    - name: Install dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build libx11-dev libxcursor-dev libxi-dev libgl1-mesa-dev libfontconfig1-dev

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install cmake ninja

    # 2. 使用 GitHub CLI 穩妥下載 Skia（能完美處理 GitHub 轉址問題）
    - name: Download Skia via GitHub CLI
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release download ${{ matrix.skia_tag }} \
          --repo aseprite/skia \
          --pattern "${{ matrix.skia_asset }}" \
          --output skia.zip
        mkdir -p $HOME/deps/skia
        unzip -q skia.zip -d $HOME/deps/skia

    # 3. 執行 CMake 配置與編譯
    - name: Run CMake & Build
      run: |
        mkdir build
        cd build
        cmake -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DENABLE_GUI=ON \
          -DLAF_BACKEND=skia \
          -DSKIA_DIR=$HOME/deps/skia \
          -DSKIA_LIBRARY_DIR=$HOME/deps/skia/out/Release-x64 \
          ..
        ninja aseprite

    # 4. 打包編譯成果
    - name: Package Artifact
      run: |
        mkdir dist
        cp -r build/bin/* dist/
        zip -r ${{ matrix.output_archive }} dist

    # 5. 上傳成品的 Zip 檔案
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.output_archive }}
