name: Build Aseprite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: 'recursive'

    - name: Setup Ninja
      uses: llvm/actions/install-ninja@main

    - name: Download Skia
      run: |
        curl -L -o skia.zip https://github.com/aseprite/skia/releases/download/m102-861e474657/Skia-Windows-Release-x64.zip
        7z x skia.zip -o"C:/deps/skia"

    - name: Run CMake
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        cmake -B build -G "Ninja" `
          -DCMAKE_BUILD_TYPE=Release `
          -DENABLE_GUI=ON `
          -DENABLE_NEEDS_CHARSET_CONVERSION_FLAG=ON `
          -DLAF_BACKEND=skia `
          -DSKIA_DIR="C:/deps/skia" `
          -DSKIA_LIBRARY_DIR="C:/deps/skia/out/Release-x64"
      shell: cmd

    - name: Build
      run: |
        call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
        ninja -C build aseprite
      shell: cmd

    - name: Package Artifact
      run: |
        mkdir dist
        xcopy /E /I build\bin dist
        powershell Compress-Archive -Path dist\* -DestinationPath aseprite-windows.zip

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aseprite-windows
        path: aseprite-windows.zip
